name: Validate SalvaSoldi

on:
  pull_request:
    paths:
      - "src/entry.py"
      - "public/salvasoldi.js"
      - "public/app.js"
      - ".github/workflows/validate-salvasoldi.yml"
  push:
    branches:
      - feature/salvasoldi
    paths:
      - "src/entry.py"
      - "public/salvasoldi.js"
      - "public/app.js"
      - ".github/workflows/validate-salvasoldi.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m py_compile src/entry.py
      - name: Check JavaScript syntax
        run: |
          node --check public/salvasoldi.js
          node --check public/app.js
